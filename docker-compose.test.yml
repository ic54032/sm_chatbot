services:
  postgres-test:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: salon
      POSTGRES_PASSWORD: salon
      POSTGRES_DB: salon_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salon"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-test:
    image: redis:7-alpine
    ports:
      # 57379 avoids Windows Hyper-V excluded port ranges (56280-56592 on this
      # machine; check: netsh interface ipv4 show excludedportrange protocol=tcp)
      - "57379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
